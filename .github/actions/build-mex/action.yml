name: build mex for one platform
description: >
  Compile the mex files MTEX builds from its own sources for the platform this
  runs on, upload them as an artifact and, when a draft release is named,
  attach them to it.

# Factored out of build-mex.yml so that the Intel macOS build can run as a
# separate job without duplicating these steps. It has to be a separate job
# rather than another matrix entry, because macos-13 runners queue for hours
# and the release publish gate must not wait on them - see the workflow.

inputs:
  ext:
    description: mex extension of this platform, e.g. mexa64
    required: true
  products:
    description: extra MATLAB products, e.g. the MinGW compiler on Windows
    required: false
    default: ''
  release_tag:
    description: draft release to attach the binaries to (empty = do not attach)
    required: false
    default: ''
  github_token:
    description: token used to upload the release assets
    required: false
    default: ''

runs:
  using: composite

  steps:
    # The release fixes the oldest MATLAB the binaries load in: a mex built by
    # R2024b does not load in anything older. Lower it if MTEX has to keep
    # supporting an older release; R2023b is the floor for a native Apple
    # silicon build.
    - name: set up MATLAB
      uses: matlab-actions/setup-matlab@v2
      with:
        release: R2024b
        products: ${{ inputs.products }}

    # buildMex.m clears this platform's binaries first and ends in
    # check_mexComplete, which fails the job if anything did not compile.
    # mex_install now raises on a failed source as well, so the job stops at
    # the build rather than at the check - the hole check stays as the net
    # for a source that produces no binary without reporting an error
    - name: build
      uses: matlab-actions/run-command@v2
      with:
        command: run(fullfile('.github','scripts','buildMex.m'))

    # A Linux mex is linked against the libstdc++ of the build compiler but
    # loaded against the one MATLAB ships, and MATLAB's is the older of the
    # two. Nothing in the build fails when the requirement is too high - the
    # binary compiles, uploads and ships, and only breaks on the user's
    # machine, with a GLIBCXX message that reads like a broken install. That
    # is issue #2482, and it cost people a day each. So check it here, where
    # the answer is one objdump away, instead of pinning a runner label and
    # hoping it keeps meaning the same compiler.
    - name: check the libstdc++ requirement
      if: runner.os == 'Linux'
      shell: bash
      run: |
        # What R2024b above ships: its sys/os/glnxa64/libstdc++.so.6.0.30 tops
        # out at GLIBCXX_3.4.30. This is the number to change if the release
        # pinned above changes - not the runner's compiler version, which only
        # has to stay at or below it.
        ceiling=GLIBCXX_3.4.30
        needed=$(objdump -p mex/*.mexa64 | grep -oE 'GLIBCXX_[0-9.]+' | sort -V | tail -1)
        echo "highest libstdc++ version required: ${needed:-none} (ceiling $ceiling)"
        if [ -n "$needed" ] && \
           [ "$(printf '%s\n%s\n' "$needed" "$ceiling" | sort -V | tail -1)" != "$ceiling" ]; then
          echo "::error::the binaries require $needed, above the $ceiling that MATLAB ships - see issue #2482"
          objdump -p mex/*.mexa64 | grep -B2 "$needed" || true
          exit 1
        fi

    - name: upload
      uses: actions/upload-artifact@v4
      with:
        name: mex-${{ inputs.ext }}
        path: mex/*.${{ inputs.ext }}
        if-no-files-found: error
        retention-days: 30

    # Attached one file at a time, deliberately not as an archive: check_mex
    # downloads them individually because Windows virus scanners object most to
    # an archive full of unsigned native libraries, and one blocked archive
    # would take every binary down with it.
    #
    # This uploads whatever mex/ holds for this platform, so the vendored NFFT
    # binaries travel with the ones just built - check_mex needs both and
    # should not have to fetch them from two different places.
    - name: attach to the release
      if: inputs.release_tag != ''
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
      run: |
        gh release upload "${{ inputs.release_tag }}" \
          mex/*.${{ inputs.ext }} \
          --clobber --repo "$GITHUB_REPOSITORY"
