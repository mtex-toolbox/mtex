<svg xmlns="http://www.w3.org/2000/svg" width="900" height="390" viewBox="0 0 900 390">
  <defs>
    <style>
      .label { font: 22px Arial, sans-serif; fill: #24292f; }
      .small { font: 18px Arial, sans-serif; fill: #57606a; }
      .value { font: 22px Arial, sans-serif; fill: #24292f; text-anchor: middle; dominant-baseline: middle; }
      .box { fill: #eef5fb; stroke: #3979a8; stroke-width: 2; rx: 7; }
      .selected { fill: #fff1cc; stroke: #b7791f; stroke-width: 3; rx: 7; }
      .arrow { fill: none; stroke: #57606a; stroke-width: 2; marker-end: url(#head); }
    </style>
    <marker id="head" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#57606a"/>
    </marker>
  </defs>

  <text class="label" x="32" y="47">source list x</text>
  <g transform="translate(210 20)">
    <text class="small" x="35" y="20" text-anchor="middle">1</text>
    <text class="small" x="115" y="20" text-anchor="middle">2</text>
    <text class="small" x="195" y="20" text-anchor="middle">3</text>
    <text class="small" x="275" y="20" text-anchor="middle">4</text>
    <text class="small" x="355" y="20" text-anchor="middle">5</text>
    <text class="small" x="435" y="20" text-anchor="middle">6</text>
    <rect class="box" x="0" y="32" width="70" height="54"/>
    <rect class="box" x="80" y="32" width="70" height="54"/>
    <rect class="box" x="160" y="32" width="70" height="54"/>
    <rect class="box" x="240" y="32" width="70" height="54"/>
    <rect class="box" x="320" y="32" width="70" height="54"/>
    <rect class="box" x="400" y="32" width="70" height="54"/>
    <text class="value" x="35" y="59">12</text>
    <text class="value" x="115" y="59">7</text>
    <text class="value" x="195" y="59">21</text>
    <text class="value" x="275" y="59">4</text>
    <text class="value" x="355" y="59">16</text>
    <text class="value" x="435" y="59">9</text>
  </g>

  <text class="label" x="32" y="177">positions [1 3 5]</text>
  <path class="arrow" d="M210,165 C170,165 170,220 210,220"/>
  <g transform="translate(250 191)">
    <rect class="selected" x="0" y="0" width="70" height="54"/>
    <rect class="selected" x="80" y="0" width="70" height="54"/>
    <rect class="selected" x="160" y="0" width="70" height="54"/>
    <text class="value" x="35" y="27">12</text>
    <text class="value" x="115" y="27">21</text>
    <text class="value" x="195" y="27">16</text>
  </g>

  <text class="label" x="32" y="307">condition x &gt; 10</text>
  <text class="small" x="210" y="337">true</text>
  <text class="small" x="290" y="337">false</text>
  <text class="small" x="370" y="337">true</text>
  <text class="small" x="450" y="337">false</text>
  <text class="small" x="530" y="337">true</text>
  <text class="small" x="610" y="337">false</text>
  <path class="arrow" d="M660,317 C685,317 685,250 698,250"/>
  <g transform="translate(700 222)">
    <rect class="selected" x="0" y="0" width="54" height="54"/>
    <rect class="selected" x="60" y="0" width="54" height="54"/>
    <rect class="selected" x="120" y="0" width="54" height="54"/>
    <text class="value" x="27" y="27">12</text>
    <text class="value" x="87" y="27">21</text>
    <text class="value" x="147" y="27">16</text>
  </g>
</svg>
